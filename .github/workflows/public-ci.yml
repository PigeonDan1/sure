name: Public CI

on:
  pull_request:
    branches: [harness-tui-agent]
  push:
    branches: [harness-tui-agent]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the public tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Check evaluation engine lock consistency
        run: python sure/skills/sure_infer/scripts/evaluation_runtime.py --engine-root sure/external/sure-evaluation --check-lock

      - name: Install system and Node dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
          npm ci --ignore-scripts

      - name: Install the locked Harness Runtime
        run: |
          python -m venv "$RUNNER_TEMP/sure-harness-venv"
          "$RUNNER_TEMP/sure-harness-venv/bin/pip" install "uv==0.7.13"
          "$RUNNER_TEMP/sure-harness-venv/bin/pip" install --require-hashes -r sure/runtime/harness/requirements.lock.txt
          echo "$RUNNER_TEMP/sure-harness-venv/bin" >> "$GITHUB_PATH"

      - name: Materialize the Harness Runtime
        run: python sure/runtime/harness/bootstrap.py --json > "$RUNNER_TEMP/harness-runtime.json"

      - name: Prepare and verify the Evaluation Runtime binding
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          temporary = Path(os.environ["RUNNER_TEMP"])
          harness = json.loads((temporary / "harness-runtime.json").read_text())
          env = dict(os.environ)
          for target, source in {
              "HARNESS_PYTHON_BIN": "python_executable",
              "SURE_HARNESS_RUNTIME_ID": "runtime_id",
              "SURE_HARNESS_LOCK_SHA256": "lock_sha256",
              "SURE_HARNESS_MANIFEST_PATH": "manifest_path",
              "SURE_HARNESS_RUNTIME_ROOT": "runtime_root",
          }.items():
              env[target] = harness[source]
          command = [
              harness["python_executable"], "sure/skills/sure_infer/scripts/evaluation_runtime.py",
              "--engine-root", "sure/external/sure-evaluation",
              "--output", str(temporary / "evaluation-runtime-binding.json"),
          ]
          subprocess.run([*command, "--prepare"], env=env, check=True)
          subprocess.run(command, env=env, check=True)
          PY

      - name: Validate the shipped default site policy
        run: npm run sure:site-check

      - name: Run repository checks
        run: npm run check

      - name: Check public compatibility rules
        run: |
          npm run check:site-compatibility -- --report "$RUNNER_TEMP/site-compatibility-report.json"
          npm run test:site-compatibility-rules

      - name: Run Python tests
        run: |
          python -m unittest discover -s sure/skills/sure_infer/scripts -p "test_*.py"
          python -m unittest discover -s sure/skills/sure_trans/scripts -p "test_*.py"
          python -m unittest discover -s sure/skills/sure_onboard/scripts -p "test_*.py"
          python -m unittest discover -s sure/skills/sure_feed/scripts -p "test_*.py"
          python -m unittest discover -s sure/skills/sure_agent_eval/scripts -p "test_*.py"
          python -m unittest discover -s sure/runtime/harness -p "test_*.py"
          python -m unittest discover -s sure/runtime/memory -p "test_*.py"
          python -m unittest discover -s sure/runtime/model -p "test_*.py"
          python -m unittest discover -s sure/runtime/model_server -p "test_*.py"
          python -m unittest discover -s sure/site -p "test_*.py"
          python -m unittest discover -s sure/skills/sure_approve/scripts -p "test_*.py"

      - name: Run coding-agent SURE tests
        working-directory: packages/coding-agent
        run: |
          npx vitest --run \
            test/suite/sure-*.test.ts \
            test/sure/*.test.ts

  public-smoke:
    name: Public export and startup
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the public tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Export the public tree twice
        env:
          PUBLIC_TREE: ${{ runner.temp }}/sure-public-one
          PUBLIC_TREE_SECOND: ${{ runner.temp }}/sure-public-two
        run: |
          npm run public:export -- --output "$PUBLIC_TREE"
          npm run public:export -- --output "$PUBLIC_TREE_SECOND"
          test ! -e "$PUBLIC_TREE/config/site.bundled.yaml"
          test ! -e "$PUBLIC_TREE/private/site"
          test ! -e "$PUBLIC_TREE/.gitlab-ci.yml"
          test -f "$PUBLIC_TREE/public-export-manifest.json"
          diff -ru "$PUBLIC_TREE" "$PUBLIC_TREE_SECOND"

      - name: Install the exported tree
        working-directory: ${{ runner.temp }}/sure-public-two
        run: npm ci --ignore-scripts

      - name: Require the shipped zero-configuration default
        working-directory: ${{ runner.temp }}/sure-public-two
        run: |
          npm run sure:site-info | tee "$RUNNER_TEMP/sure-site-info.txt"
          grep -F "configured: true" "$RUNNER_TEMP/sure-site-info.txt"
          grep -F "source: default" "$RUNNER_TEMP/sure-site-info.txt"
          npm run sure:site-check

      - name: Validate configured public startup
        working-directory: ${{ runner.temp }}/sure-public-two
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
        run: |
          cp config/site.example.yaml config/site.local.yaml
          npm run sure:site-info | tee "$RUNNER_TEMP/sure-site-info-local.txt"
          grep -F "site_id: public-example" "$RUNNER_TEMP/sure-site-info-local.txt"
          grep -F "source: local" "$RUNNER_TEMP/sure-site-info-local.txt"
          npm run sure:site-check
          npm run sure:doctor
          PI_OFFLINE=1 ./pi-test.sh --help > /dev/null
