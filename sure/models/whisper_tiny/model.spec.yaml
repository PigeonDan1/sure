model_id: "whisper_tiny"
model_name: "openai/whisper-tiny"
task_type: "asr"
deployment_type: "local"

repo:
  url: "https://huggingface.co/openai/whisper-tiny"
  commit: "169d4a4341b33bc18d8881c4b69c2e104e1cc0af"

weights:
  source: "huggingface"
  local_path: null
  required: true
  cache_policy: "model_local_first"
  local_dir_name: "checkpoints"

environment:
  preferred_backend: "pip"
  python_version: "3.10"
  requires_gpu: false
  system_packages: []

entrypoints:
  import_test: "from model import WhisperTinyASR"
  load_test: "WhisperTinyASR(model_path='checkpoints', device='cpu').load()"
  infer_test: "WhisperTinyASR(model_path='checkpoints', device='cpu').transcribe('fixture/asr/asr_en/sample_1.wav')"

io_contract:
  input_type: "audio_path"
  output_type: "json"
  primary_field: "text"
  required_fields: ["text"]
  nonempty_fields: ["text"]
  json_serializable: true

acceptance:
  must_import: true
  must_load: true
  must_infer: true
  must_return_nonempty: true