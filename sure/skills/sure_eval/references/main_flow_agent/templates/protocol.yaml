schema: sure.eval.inference_protocol.v1
protocol_id: {protocol_id}
run:
  run_id: {run_id}
  run_dir: {run_dir}
  created_at: '{created_at}'
model:
  model_name: {model_name}
  model_dir: {model_dir}
  model_source: {model_source}
  weights_source: {weights_source}
  model_dir_source: {model_dir_source}
  mcp_tool_name: {mcp_tool_name}
  server_config:
    command:
{server_command_yaml}
    working_dir: {server_working_dir}
    timeout: {server_timeout}
    startup_timeout_sec: {server_startup_timeout_sec}
    env_keys:
{server_env_keys_yaml}
protocol_selection:
  protocol_id: {protocol_id}
  definition_path: {protocol_definition_path}
  model_protocol_config_path: {model_protocol_config_path}
  is_default: {protocol_is_default}
  purpose: {protocol_purpose}
  standard_params:
{protocol_standard_params_yaml}
  resolved_model_params:
{resolved_model_params_yaml}
  unmapped:
{unmapped_protocol_params_yaml}
inference_environment:
  execution_path: {execution_path}
  vc:
    job_id: {vc_job_id}
    partition: {vc_partition}
    gpu_count: {vc_gpu_count}
    memory: {vc_memory}
    cpu_count: {vc_cpu_count}
    node_count: {vc_node_count}
    require_vc_submit: {require_vc_submit}
    allow_partition_fallback: {allow_partition_fallback}
    preflight_required: {preflight_required}
  container:
    image: {docker_image}
    dockerfile: {dockerfile}
    repo_root: {container_repo_root}
    model_dir: {container_model_dir}
    python_executable: {container_python_executable}
  server:
    transport: {server_transport}
    command:
{server_command_yaml}
    tool_name: {mcp_tool_name}
    startup_timeout_sec: {server_startup_timeout_sec}
    timeout: {server_timeout}
  env:
    device: {device}
    env_keys:
{server_env_keys_yaml}
    modelscope_cache: {modelscope_cache}
  mount_policy:
    mount_stable_absolute_roots:
{mount_stable_absolute_roots_yaml}
    reject_repo_internal_runtime_mount_overlays: {reject_repo_internal_runtime_mount_overlays}
inference_constraints:
  no_external_lm: {no_external_lm}
  no_retrieval: {no_retrieval}
  no_hotwords: {no_hotwords}
  single_pass_decode: {single_pass_decode}
  no_prompt_engineering: {no_prompt_engineering}
  local_fallback_allowed: {local_fallback_allowed}
  metric_logic_in_inference_image_allowed: {metric_logic_in_inference_image_allowed}
  required_preflight_checks:
{required_preflight_checks_yaml}
execution_surface:
  materialized: {execution_surface_materialized}
  execution_surface_type: {execution_surface_type}
  entrypoint_path: {execution_entrypoint_path}
  generation_method: {execution_generation_method}
  template_file: {execution_template_file}
  template_sha256: {execution_template_sha256}
  isolation_compliance:
    eval_runs_referenced: {eval_runs_referenced}
    prior_run_scripts_copied: {prior_run_scripts_copied}
    deviation_approved_by_user: {deviation_approved_by_user}
prediction_contract:
  contract_path: {prediction_contract_path}
  compatibility_tsv: {prediction_compatibility_tsv}
  structured_jsonl: {prediction_structured_jsonl}
  format_used: {prediction_format_used}
  generated_by: {prediction_generated_by}
  protocol_argument: {protocol_id}
notes:
- This file records inference protocol, runtime environment, inference parameters, and inference constraints only.
- Dataset scope, evaluation routes, metric results, validation, and metric artifacts are recorded in report_snapshot.md and report.jsonl.
