schema: sure.site.policy.v1
site_id: public-example
policy_version: 1

storage:
  approved_models_roots:
    - /srv/sure/models
  approved_results_roots:
    - /srv/sure/results
  forbidden_output_roots:
    - /srv/sure
  runtime_root: /var/cache/sure/runtime

datasets:
  allowed_source_roots:
    default: /srv/sure/datasets
  projection_root: /var/lib/sure/dataset-projections

execution:
  surfaces:
    - local
  local_runtimes:
    - python
    - container

network:
  container_registry: registry.example.com

container_delivery:
  repository_template: "{registry}/example-org/sure-{task}-{model_name}"
