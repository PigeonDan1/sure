name: asr_qwen3
task: ASR
description: "Automatic Speech Recognition using Qwen3-ASR-1.7B"
version: "1.0.0"

runtime:
  identity: "Qwen3-ASR-1.7B"
  load_identity: "Qwen/Qwen3-ASR-1.7B"
  local_dir_name: "asr_qwen3"

backend:
  chosen: "uv"
  reason: "pure python dependencies, modelscope for weights, no cuda compilation needed"
  evidence:
    - "pyproject.toml present with qwen-asr dependency"
    - "modelscope accessible for weight download"
    - "huggingface not accessible in cluster"

weights:
  required: true
  source: "modelscope"
  repo_id: "Qwen/Qwen3-ASR-1.7B"
  local_path: "./.runtime/modelscope_cache/models/Qwen/Qwen3-ASR-1.7B"
  size_gb: 4.4

io_contract:
  input:
    audio_path: string
    language: string (optional, e.g. "Chinese", "English", "auto")
  output:
    text: string
    language: string
    timestamps: list[dict] (optional)

environment:
  python: ">=3.10"
  packages:
    - qwen-asr
    - torch
    - transformers==4.57.6
    - accelerate==1.12.0
    - soundfile
    - scipy

resources:
  memory_gb: 8
  gpu: recommended
  cpu_cores: 4
  storage_gb: 5

mcp_server:
  command: [".venv/bin/python", "server.py"]
  working_dir: "/hpc_stor03/sjtu_home/jing.peng/workspace/sure-eval/src/sure_eval/models/asr_qwen3"
  env:
    MODEL_PATH: "Qwen/Qwen3-ASR-1.7B"
    MODELSCOPE_CACHE: "/hpc_stor03/sjtu_home/jing.peng/workspace/sure-eval/src/sure_eval/models/asr_qwen3/.runtime/modelscope_cache"
    DEVICE: "auto"
  timeout: 300
