model_id: iic/SenseVoiceSmall
model_name: asr_sensevoice_small
task_type: ASR
deployment_type: local
runtime:
  identity: SenseVoiceSmall
  load_identity: iic/SenseVoiceSmall
  family: funasr_sensevoice
repo:
  url: https://modelscope.cn/models/iic/SenseVoiceSmall
  commit: null
weights:
  source: modelscope
  repo_id: iic/SenseVoiceSmall
  local_path: .runtime/modelscope_cache/models/iic/SenseVoiceSmall
  required: true
  cache_policy: model_local_first
environment:
  preferred_backend: uv
  python_version: "3.11"
  requires_gpu: false
  gpu_note: GPU is preferred when available; CPU validation is acceptable by model_input for this lightweight model.
  system_packages:
    - ffmpeg
    - git
    - libsndfile1
  package_hints:
    - funasr
    - modelscope
    - torch==2.4.0
    - torchaudio==2.4.0
    - soundfile
    - numpy<2
entrypoints:
  import_test: "from funasr import AutoModel"
  load_test: "AutoModel(model='<model_local_cache>', device='cuda' if available else 'cpu')"
  infer_test: "model.generate(input='<fixture_wav>', language='auto')"
fixture:
  source: fixtures/tasks/asr/qwen3_asr_smoke/asr_zh
  local_path: fixture/asr/asr_zh
  manifest: fixture/asr/asr_zh/gt.jsonl
io_contract:
  input_type: audio_path
  output_type: json
  primary_field: text
  required_fields:
    - text
  nonempty_fields:
    - text
  json_serializable: true
acceptance:
  must_import: true
  must_load: true
  must_infer: true
  must_validate_contract: true
  must_build_docker: true
  must_validate_docker: true
  must_push_and_pull_image: true
notes:
  - Re-onboarding run generated from src/sure_eval/models_reonboard/model_inputs/asr_sensevoice_small.yaml.
  - Existing ModelScope cache is reused by symlink; old wrapper, old venv, and old Dockerfile are not reused.
  - CER is recorded as an artifact for the selected Chinese ASR fixture.
