[project]
name = "sure-eval-deepfilternet"
version = "0.1.0"
description = "SURE-EVAL phase-1 onboarding wrapper for DeepFilterNet"
requires-python = ">=3.10,<3.13"
dependencies = [
  "deepfilternet==0.5.6",
  "soundfile>=0.12,<0.14",
  "torch==2.2.2",
  "torchaudio==2.2.2",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false

[tool.setuptools]
py-modules = []
