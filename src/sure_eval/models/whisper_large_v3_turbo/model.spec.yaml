model_id: openai/whisper-large-v3-turbo
model_name: whisper_large_v3_turbo
task_type: ASR
deployment_type: local
runtime:
  identity: Whisper large-v3-turbo
  load_identity: turbo
  family: openai_whisper
repo:
  url: https://github.com/openai/whisper
  mirror_url: https://modelscope.cn/models/iic/Whisper-large-v3-turbo
  commit: null
weights:
  source: modelscope
  repo_id: iic/Whisper-large-v3-turbo
  local_path: checkpoints/large-v3-turbo.pt
  required: true
  cache_policy: model_local_first
environment:
  preferred_backend: uv
  python_version: "3.11"
  requires_gpu: false
  gpu_note: GPU should be used if available; CPU phase-1 validation is acceptable by model_input.
  system_packages:
    - ffmpeg
  package_hints:
    - openai-whisper
    - torch==2.4.0
    - imageio-ffmpeg
entrypoints:
  import_test: "import whisper"
  load_test: "whisper.load_model('turbo', download_root='checkpoints')"
  infer_test: "model.transcribe('<fixture_wav>')"
fixture:
  source: fixtures/tasks/asr/qwen3_asr_smoke/asr_zh
  local_path: fixture/asr/asr_zh
  manifest: fixture/asr/asr_zh/gt.jsonl
io_contract:
  input_type: audio_path
  output_type: json
  primary_field: text
  required_fields:
    - text
  nonempty_fields:
    - text
  json_serializable: true
acceptance:
  must_import: true
  must_load: true
  must_infer: true
  must_validate_contract: true
  must_build_docker: true
  must_validate_docker: true
  must_push_and_pull_image: true
notes:
  - Re-onboarding run generated from src/sure_eval/models_reonboard/model_inputs/whisper_large_v3_turbo.yaml.
  - Existing checkpoint is reused by symlink; old wrapper, old venv, and old Dockerfile are not reused.
  - CER is recorded as an artifact for the selected Chinese ASR fixture.
