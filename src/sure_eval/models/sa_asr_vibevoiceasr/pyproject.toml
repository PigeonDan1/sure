[project]
name = "sa_asr_vibevoiceasr"
version = "0.1.0"
description = "Microsoft VibeVoice-ASR wrapper for SURE-EVAL"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5.0",
    "transformers>=4.51.0",
    "accelerate>=1.0.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest"]
